<!doctype html>
<html lang="de">
<head>

<title>Anfrage erhalten | Artur WebDesign</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23101313'/%3E%3Cpath d='M14 48 28 15h9l14 33h-9l-3-8H26l-3 8h-9Zm15-15h7l-3.5-10L29 33Z' fill='%233eb8e5'/%3E%3C/svg%3E">
<style>
:root{--ink:#101313;--paper:#ece9e1;--accent:#3eb8e5;--muted:#58605b}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:var(--ink);color:#f3f1e9;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:1.5rem}
main{position:relative;max-width:700px;padding:clamp(2rem,7vw,5rem);background:var(--paper);color:#141817;box-shadow:13px 13px 0 var(--accent)}
main::before{content:"";position:absolute;inset:12px;border:1px solid rgba(16,19,19,.16);pointer-events:none}
.inner{position:relative}
.mark{display:grid;place-items:center;width:44px;height:44px;background:var(--accent);font-size:1.5rem;font-weight:900;margin-bottom:2rem}
p.label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:850;color:#516057}
h1{font-family:ui-serif,Georgia,serif;font-size:clamp(3rem,8vw,5.5rem);font-weight:500;letter-spacing:-.07em;line-height:.9;margin:.6rem 0 1.4rem}
p.copy{max-width:43ch;color:var(--muted);line-height:1.65}
a{display:inline-flex;align-items:center;gap:.55rem;margin-top:2rem;background:var(--ink);color:#f3f1e9;padding:.86rem 1.05rem;font-weight:850;text-decoration:none}
a:hover{background:#29312d}
:focus-visible{outline:3px solid #1b7fa8;outline-offset:4px}
</style>
</head>
<body>
<main>
  <div class="inner">
    <div class="mark" aria-hidden="true">✓</div>
    <p class="label">Anfrage übertragen</p>
    <h1>Danke für den klaren Anfang.</h1>
    <p class="copy">Ihre Nachricht ist angekommen — ich melde mich zeitnah am nächsten Werktag. Wenn Sie etwas ergänzen möchten, schreiben Sie direkt an <a style="margin:0;padding:0;background:transparent;color:inherit;text-decoration:underline" href="mailto:info@artur.ae">info@artur.ae</a>.</p>
    <a href="index.html">Zur Startseite <span aria-hidden="true">→</span></a>
    <p style="margin-top:1.6rem;font-size:.72rem;color:var(--muted)"><a href="impressum.html" style="margin:0;padding:0;background:transparent;color:inherit;text-decoration:underline">Impressum</a> · <a href="datenschutz.html" style="margin:0;padding:0;background:transparent;color:inherit;text-decoration:underline">Datenschutz</a></p>
  </div>
</main>
</body>
</html>
