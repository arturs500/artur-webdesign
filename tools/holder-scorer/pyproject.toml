[project]
name = "holder-scorer"
version = "0.3.5"
description = "Bewertet, ob ein pump.fun-Token wahrscheinlich mehr Holder bekommt (Filter für Sniper-Bots)"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
watch = ["websockets>=12"]
test = ["pytest>=7"]

[project.scripts]
holder-scorer = "holder_scorer.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["holder_scorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
